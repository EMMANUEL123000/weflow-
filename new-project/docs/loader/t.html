<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <title>Document</title>
    <style>
      form {
        max-width: 400px;
        margin: 0 auto;
      }
      .input-field {
        width: 100%;
        padding: 10px;
        margin-bottom: 4px;
        text-align: center;

        border: 0.5px 0.5px 0 gray;
      }
      .input-field :hover {
        border: 0.1px;
      }
      div .fa-solid {
        padding: 10px;
        min-width: 40px;
        position: absolute;
        color: gray;
      }
    </style>
  </head>
  <body>
    <form action="">
      <div>
        <i class="fa-solid fa-user"></i>
        <input type="text" class="input-field" />
        <i class="fa-solid fa-envelope"></i>
        <input type="text" class="input-field" />
      </div>
    </form>
  </body>
</html>
