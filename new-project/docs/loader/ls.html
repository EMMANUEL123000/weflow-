<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <meta http-equiv="refresh" content="1.5; url=signin.html" />
    <!-- This line is the magic - it waits 1.5 seconds then goes to login.html -->

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        font-family: sans-serif;
      }
      .loader-box {
        text-align: center;
      }
      .spinner {
        width: 60px;
        height: 60px;
        border: 5px solid #e8f0fe;
        border-top: 5px solid #1a73e8;
        border-radius: 50%;
        margin: 0 auto 15px auto;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      p {
        color: #555;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="loader-box">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </body>
</html>
