<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="refresh"
      content="1.5; url=/new-project/docs/signin.html"
    />

    <title>Flowly - Login</title>

    <style>
      /* LOADING SCREEN */

      .loader {
        position: fixed;
        inset: 0;

        background: white;

        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;

        z-index: 9999;

        animation: hideLoader 0.5s ease 1.5s forwards;
      }

      .spinner {
        width: 45px;
        height: 45px;

        border: 4px solid #e9d5ff;
        border-top: 4px solid #7c3aed;

        border-radius: 50%;

        animation: spin 0.8s linear infinite;
      }

      .loader p {
        color: #7c3aed;
        font-family: Arial, sans-serif;
        font-weight: 600;
      }

      /* SPINNER */

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* HIDE LOADER */

      @keyframes hideLoader {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      /* LOGIN PAGE */

      .login-page {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;

        opacity: 0;

        animation: showLogin 0.5s ease 1.5s forwards;
      }

      @keyframes showLogin {
        to {
          opacity: 1;
        }
      }

      .login-box {
        width: 350px;
        padding: 40px;

        background: white;

        border-radius: 16px;

        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      }

      .login-box h1 {
        color: #18181b;
      }

      .login-box input {
        width: 100%;
        box-sizing: border-box;

        padding: 13px;

        margin-top: 12px;

        border: 1px solid #ddd;
        border-radius: 8px;
      }

      .login-box button {
        width: 100%;

        margin-top: 20px;

        padding: 13px;

        border: none;
        border-radius: 8px;

        background: #7c3aed;
        color: white;

        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <!-- LOADING SCREEN -->

    <div class="loader">
      <div class="spinner"></div>

      <p>Loading ...</p>
    </div>
  </body>
</html>
